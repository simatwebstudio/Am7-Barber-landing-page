<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina non trovata · AM7 Barber</title>
  <meta name="description" content="La pagina cercata non esiste. Torna alla home di AM7 Barber, barberia a Bra.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#080808">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png" sizes="48x48">
  <link rel="icon" type="image/png" href="assets/icons/favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="assets/icons/favicon-16.png" sizes="16x16">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="styles.css">
  <style>
    /* Regole locali alla 404: il design system resta quello di styles.css,
       che non definisce un h1 fuori dalla hero. Nessuna modifica al sito. */
    .error-page {
      display: flex;
      min-height: 100vh;
      min-height: 100svh;
      flex-direction: column;
      justify-content: center;
    }

    .error-page h1 {
      max-width: 12ch;
      margin-right: auto;
      margin-left: auto;
      font-size: clamp(3rem, 7vw, 6.2rem);
      line-height: .88;
    }

    /* Stesso lockup del brand in header/footer: "AM7" in Inter,
       "Barber" in Fraunces corsivo. */
    .error-page__home {
      display: inline-block;
      margin-bottom: 40px;
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -.05em;
      text-decoration: none;
    }

    .error-page__home span {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Vai al contenuto</a>

  <main id="main-content">
    <section class="section section--dark booking error-page" aria-labelledby="error-title">
      <a class="error-page__home" href="/">AM7 <span>Barber</span></a>
      <p class="eyebrow">Errore 404</p>
      <h1 id="error-title">Questa pagina non esiste.</h1>
      <p>L'indirizzo è sbagliato o la pagina è stata rimossa. Il sito di AM7 Barber è tutto sulla home: servizi, prezzi, orari e contatti.</p>
      <div class="actions actions--center">
        <a class="btn" href="/">Torna alla home</a>
        <a class="btn btn--ghost" href="tel:+393272459352">Chiama</a>
      </div>
      <p class="booking__proof">Via Vittorio Emanuele, 91 · Bra · 327 245 9352</p>
    </section>
  </main>
</body>
</html>
